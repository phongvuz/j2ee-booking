spring.application.name=booking

# --- Database (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/booking}
spring.datasource.username=${DB_USERNAME_LOCAL:booking}
spring.datasource.password=${DB_PASSWORD_LOCAL:booking_local}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA: schema do Flyway quan ly, Hibernate chi kiem tra khop ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.error.include-message=always

# --- CORS: danh sach origin cua frontend (phan cach bang dau phay) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Đơn vé: tự hủy đơn PENDING quá hạn thanh toán ---
app.order.pending-timeout-minutes=15
app.order.expiration-check-ms=60000
